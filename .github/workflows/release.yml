name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must equal v plus versionName in app/build.gradle.kts, for example v1.0.1)
        required: true
      expected_head:
        description: Exact reviewed main commit SHA (required)
        required: true
      notes:
        description: What changed (shown in the in-app update prompt)
        required: true
        default: Bug fixes and improvements.

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require reviewed exact main head before signing
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Download public APK archive regression fixtures
        run: |
          mkdir -p app/build/apk-fixtures
          curl --fail --location --retry 2 https://github.com/prayagi-store-and-services/netra-hub/releases/download/v1.5.0/app-release.apk -o app/build/apk-fixtures/renamed-hub.apk
          curl --fail --location --retry 2 https://github.com/prayagi-store-and-services/KBC/releases/download/v1.1.37/app-release.apk -o app/build/apk-fixtures/other-app.apk
          printf '%s\n' '72fc7113fe293145691d0a4a4866191bdfe0296ca9721b8f6f5fce6e4fb8944e  app/build/apk-fixtures/renamed-hub.apk' 'e1349cb3ad8688587b52d7c4125ee67c3472a55cd3fa85229a58734f24671c16  app/build/apk-fixtures/other-app.apk' | sha256sum --check --strict
          curl --fail --location --retry 2 https://github.com/prayagi-store-and-services/netra-hub/releases/download/v1.5.2/app-release.apk -o app/build/apk-fixtures/checked-hub.apk
          printf '%s\n' '0f07aa1681888893b4e27ad194783d0ab41afc0d05787de14cd0f189e85f4245  app/build/apk-fixtures/checked-hub.apk' | sha256sum --check --strict
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify the APK production signer
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/netra-cert.txt"
          # Independently decoded from Eco v1.2.42, not inferred from another app.
          test "$(grep -c 'certificate SHA-256 digest:' "$RUNNER_TEMP/netra-cert.txt")" = 1
          CERT="$(sed -nE 's/^(Signer #1|V2 Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\2/p' "$RUNNER_TEMP/netra-cert.txt" | tr 'A-F' 'a-f')"
          test "$CERT" = "543b46402206ae0022d352f65bea618386bd7aa681b4d5bcfb5ce02bac49c8c4"
      - name: Check signed APK identity before staging
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/netra-badging.txt"
          python3 - "$RUNNER_TEMP/netra-badging.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          match = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", text, re.M)
          assert match and match.groups() == ('com.prayagi.netraeco', '59', '1.2.45'), 'Unexpected signed APK identity'
          PY
      - name: Stage draft release for independent audit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          D=app/build/outputs/apk/release
          VNAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VCODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG" = "v$VNAME"
          # Refuse an existing tag/draft rather than resuming an uncertain partial publication.
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect it manually instead of retrying."
            exit 1
          fi
          # Named copy for people. app-release.apk stays because the in-app updater needs that exact name.
          NAMED="$D/NetraEco-$TAG.apk"
          cp "$D/app-release.apk" "$NAMED"
          SHA="$(sha256sum "$D/app-release.apk" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$D/app-release.apk")"
          jq -n --arg tag "$TAG" --arg vn "$VNAME" --argjson vc "$VCODE" --arg sha "$SHA" --argjson size "$SIZE" --arg notes "$NOTES" \
            '{tag:$tag,versionName:$vn,versionCode:$vc,sha256:$sha,size:$size,notes:$notes}' > "$D/latest.json"
          gh release create "$TAG" "$D/app-release.apk" "$NAMED" "$D/latest.json" --draft \
            --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
      - name: Upload signed APK and manifest for independent audit
        uses: actions/upload-artifact@v7
        with:
          name: signed-eco-audit
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/latest.json
          if-no-files-found: error
      - name: Delete restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/netra-release.jks"
