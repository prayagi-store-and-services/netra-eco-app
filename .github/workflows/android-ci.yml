name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Install build-tools for fixture identity
        run: yes | sdkmanager "build-tools;34.0.0" > /dev/null
      - name: Download public APK archive regression fixtures
        run: |
          mkdir -p app/build/apk-fixtures
          curl --fail --location --retry 2 https://github.com/prayagi-store-and-services/netra-hub/releases/download/v1.5.0/app-release.apk -o app/build/apk-fixtures/renamed-hub.apk
          curl --fail --location --retry 2 https://github.com/prayagi-store-and-services/KBC/releases/download/v1.1.37/app-release.apk -o app/build/apk-fixtures/other-app.apk
          # Charge v0.1.0 direct-site fixture (the direct URL always serves the latest release, so this pin must move with each Charge release).
          curl --fail --location --retry 2 https://prayagi-store-and-services.github.io/netra-eco/downloads/netra-charge/app-release.apk -o app/build/apk-fixtures/charge.apk
          printf '%s\n' '72fc7113fe293145691d0a4a4866191bdfe0296ca9721b8f6f5fce6e4fb8944e  app/build/apk-fixtures/renamed-hub.apk' 'e1349cb3ad8688587b52d7c4125ee67c3472a55cd3fa85229a58734f24671c16  app/build/apk-fixtures/other-app.apk' '1119987250ea79e3d2d0c6b8895dd77d25c7078ec9dfd449b0028ee7400204ae  app/build/apk-fixtures/charge.apk' | sha256sum --check --strict
      - name: Verify Charge fixture identity independently (apksigner + aapt)
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs app/build/apk-fixtures/charge.apk | grep -F "SHA-256 digest: 814d2dd07f8ba510643795215f61083d1ebc905a5e9b3fba570faa5862381ab9"
          "$BT/aapt" dump badging app/build/apk-fixtures/charge.apk | grep -F "package: name='com.netracharge.app' versionCode='1' versionName='0.1.0'"
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-diagnostics
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/android-build.log
      - name: Preserve full suite results before filtered screenshot rerun
        if: always()
        run: |
          mkdir -p app/build/full-suite-results
          cp app/build/test-results/testDebugUnitTest/*.xml app/build/full-suite-results/ || true
      - name: Render production header and Charge screens for visual review
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.prayagi.netraeco.BrandScreenshotTest --tests com.prayagi.netraeco.HumanSafetyHoldScreenTest --tests com.prayagi.netraeco.ChargeScreenshotTest -Droborazzi.test.record=true --stacktrace
      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/full-suite-results/*.xml
            app/build/ci-diagnostics/android-build.log
            app/build/outputs/ecosystem-header.png
            app/build/outputs/human-safety-hold*.png
            app/build/outputs/charge-*.png
          if-no-files-found: warn

  instrumented-charge-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Download pinned public Charge fixture
        run: |
          mkdir -p app/build/apk-fixtures
          curl --fail --location --retry 2 https://prayagi-store-and-services.github.io/netra-eco/downloads/netra-charge/app-release.apk -o app/build/apk-fixtures/charge.apk
          echo "1119987250ea79e3d2d0c6b8895dd77d25c7078ec9dfd449b0028ee7400204ae  app/build/apk-fixtures/charge.apk" | sha256sum --check --strict
      - name: Run Charge instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          script: |
            adb devices -l
            adb push app/build/apk-fixtures/charge.apk /sdcard/Download/eco-fixture-charge.apk
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: charge-instrumented-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
