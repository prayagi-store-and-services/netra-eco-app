name: UI screenshots (manual check)

on:
  pull_request:
    paths: ['.github/workflows/ui-screenshots.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prayagideepak-collab-patch-31
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create and boot emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "system-images;android-34;google_apis;x86_64"
          mkdir -p $HOME/.android/avd
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo no | avdmanager create avd -n t -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          avdmanager list avd
          $ANDROID_HOME/emulator/emulator -list-avds
          ls -l /dev/kvm || true
          nohup $ANDROID_HOME/emulator/emulator -avd t -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > emu.log 2>&1 &
          sleep 20
          tail -20 emu.log || true
          timeout 300 adb wait-for-device || { echo "wait-for-device timed out"; tail -50 emu.log; exit 1; }
          booted=0
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          [ "$booted" = 1 ] || { echo "boot timed out"; tail -50 emu.log; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Drive the app and take screenshots
        run: |
          mkdir -p shots
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          cat > drive.py <<'PY'
          import subprocess, re, time, sys
          import xml.etree.ElementTree as ET
          n = 0
          def sh(*a):
              return subprocess.run(["adb"] + list(a), capture_output=True).stdout
          def shot(name):
              global n
              n += 1
              open("shots/%02d-%s.png" % (n, name), "wb").write(sh("exec-out", "screencap", "-p"))
              print("shot", n, name, flush=True)
          def nodes():
              sh("shell", "uiautomator", "dump", "/sdcard/u.xml")
              x = sh("shell", "cat", "/sdcard/u.xml").decode("utf8", "ignore")
              try:
                  root = ET.fromstring(x)
              except Exception:
                  return []
              out = []
              for e in root.iter("node"):
                  b = re.findall(r"\d+", e.get("bounds", ""))
                  if len(b) == 4:
                      out.append(((e.get("text") or "") + " " + (e.get("content-desc") or "")).strip(), ) if False else out.append(((e.get("text") or e.get("content-desc") or ""), tuple(map(int, b))))
              return out
          def find(sub):
              for t, b in nodes():
                  if sub.lower() in t.lower():
                      return b
              return None
          def tap_exact(t):
              for tx, b in nodes():
                  if tx.strip() == t:
                      sh("shell", "input", "tap", str((b[0] + b[2]) // 2), str((b[1] + b[3]) // 2))
                      time.sleep(1.5)
                      return True
              print("NOT FOUND exact", t, flush=True)
              return False
          def tap(sub, tries=1):
              b = find(sub)
              if not b:
                  print("NOT FOUND", sub, flush=True)
                  return False
              sh("shell", "input", "tap", str((b[0] + b[2]) // 2), str((b[1] + b[3]) // 2))
              time.sleep(1.5)
              return True
          def swipe_up(dist=1100):
              sh("shell", "input", "swipe", "540", "1900", "540", str(1900 - dist), "400")
              time.sleep(1)
          def scroll_to(sub, maxn=25):
              for _ in range(maxn):
                  b = find(sub)
                  if b and b[1] > 150 and b[3] < 2250:
                      return b
                  swipe_up(700)
              return None
          def type_in(label, value):
              b = scroll_to(label, 8)
              if not b:
                  print("NOT FOUND field", label, flush=True)
                  return
              sh("shell", "input", "tap", str((b[0] + b[2]) // 2), str((b[1] + b[3]) // 2))
              time.sleep(0.8)
              sh("shell", "input", "text", value)
              time.sleep(0.8)
              sh("shell", "input", "keyevent", "66")
              time.sleep(0.8)

          sh("shell", "monkey", "-p", "com.prayagi.netraeco", "-c", "android.intent.category.LAUNCHER", "1")
          time.sleep(8)
          def dismiss():
              for _ in range(4):
                  if find("isn't responding"):
                      tap("Wait")
                  elif find("Don") and find("Allow"):
                      tap("Allow")
                  else:
                      break
                  time.sleep(2)
          dismiss()
          shot("home")
          dismiss()
          b = scroll_to("Open Trikaal", 30)
          dismiss()
          shot("trikaal-entry")
          if b:
              tap("Open Trikaal")
              time.sleep(10)
              shot("dialog-top-ticker-location")
              time.sleep(8)
              shot("dialog-top-ticker-later")
              # location: first deny
              tap("Yes, use my location")
              time.sleep(2)
              shot("permission-prompt")
              if not tap("Don"):
                  tap("Deny")
              time.sleep(2)
              shot("after-decline-fallback")
              sh("emu", "geo", "fix", "77.209", "28.614")
              tap("Use my location")
              time.sleep(2)
              shot("permission-prompt-2")
              if not tap("While using"):
                  tap("Allow")
              time.sleep(4)
              shot("after-allow")
              type_in("Name /", "Test")
              shot("after-name")
              if scroll_to("Choose date of birth", 6):
                  tap("Choose date of birth")
                  time.sleep(2)
                  shot("date-picker")
                  tap_exact("1")
                  shot("date-1-selected")
                  tap("OK")
                  shot("after-date-ok")
                  time.sleep(1)
              if scroll_to("Choose birth time", 6):
                  tap("Choose birth time")
                  time.sleep(2)
                  shot("time-picker-ampm")
                  tap("OK")
                  time.sleep(1)
                  shot("after-time-ok")
              if scroll_to("Birth place", 6):
                  b2 = find("Birth place")
                  sh("shell", "input", "tap", str((b2[0] + b2[2]) // 2), str((b2[1] + b2[3]) // 2))
                  time.sleep(0.8)
                  sh("shell", "input", "text", "Allahabad")
                  time.sleep(2)
                  shot("place-search-allahabad")
                  sh("shell", "input", "keyevent", "4")
                  time.sleep(1.5)
                  shot("place-suggestions-keyboard-hidden")
                  tap("Prayagraj")
                  time.sleep(1)
              shot("form-filled")
              scroll_to("Calculate", 8)
              tap("Calculate")
              time.sleep(8)
              shot("after-calculate")
              tap("Save")
              time.sleep(2)
              if tap("Detailed"):
                  time.sleep(3)
              for i in range(14):
                  swipe_up(1000)
                  shot("scroll-%02d" % i)
              scroll_to("Coming Soon", 5)
              tap("Tithi food guide")
              shot("coming-soon-expanded")
              tap("Download PDF")
              shot("kundli-pdf-button-tapped")
          print("done")
          PY
          python3 drive.py
      - name: Publish screenshots to a branch for inspection
        if: always()
        run: |
          git config user.name "ui-shots"
          git config user.email "ui-shots@users.noreply.github.com"
          git checkout --orphan ui-shots-${{ github.run_id }}
          git rm -rf . >/dev/null 2>&1 || true
          git add -f shots
          git commit -m "UI screenshots for run ${{ github.run_id }}"
          git push origin ui-shots-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: |
            shots
            emu.log
