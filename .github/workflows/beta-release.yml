name: Beta Release (pre-release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Beta tag, must be v plus versionName plus -beta.N (for example v1.2.23-beta.1)
        required: true
      notes:
        description: What testers should try and what changed (plain words, honest)
        required: true

permissions:
  contents: write

jobs:
  signed-beta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify the APK is signed
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          D=app/build/outputs/apk/release
          VNAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [[ "$TAG" =~ ^v${VNAME//./\.}-beta\.[0-9]+$ ]]
          NAMED="$D/NetraEco-$TAG.apk"
          cp "$D/app-release.apk" "$NAMED"
          SHA="$(sha256sum "$NAMED" | cut -d' ' -f1)"
          # Pre-release only: the in-app updater reads the latest STABLE release, so stable users never see this build.
          gh release create "$TAG" "$NAMED" --prerelease --latest=false \
            --title "$TAG (beta)" --target "$GITHUB_SHA" \
            --notes "BETA build for testers. Not the stable release. sha256 $SHA"$'\n\n'"$NOTES"
